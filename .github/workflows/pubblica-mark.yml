# Pubblica Mark (app + cervello) sul tuo account Cloudflare, piano gratuito.
# Parte da sola quando cambia qualcosa in mark2/ su main, oppure a mano da Actions › "Pubblica Mark" › Run workflow.
#
# Una volta sola, in GitHub › Settings › Secrets and variables › Actions › New repository secret, aggiungi:
#   CLOUDFLARE_API_TOKEN   token Cloudflare creato con il modello "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  l'Account ID che vedi nella home del dashboard Cloudflare
#   ANTHROPIC_API_KEY      la chiave Claude API
#   APP_SECRET             un codice lungo inventato da te: lo scriverai nell'app la prima volta
# Facoltativo: AZURE_SPEECH_KEY (voce Azure). I segreti non compaiono mai nei log né nel codice.
name: Pubblica Mark
on:
  push:
    branches: [main]
    paths: ["mark2/**", ".github/workflows/pubblica-mark.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pubblica-mark
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mark2/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controlla i segreti
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do [ -z "${!n}" ] && missing="$missing $n"; done
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "$APP_SECRET" ] && missing="$missing APP_SECRET"
          if [ -n "$missing" ]; then echo "::error::Mancano questi segreti in GitHub:$missing"; exit 1; fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
      - name: Installa
        run: npm ci --no-audit --no-fund
      - name: Memoria (KV) – la crea la prima volta, poi riusa sempre la stessa
        run: |
          title="mark2-memoria"
          id=$(npx wrangler kv namespace list | node scripts/kv-id.mjs "$title")
          if [ -z "$id" ]; then
            npx wrangler kv namespace create "$title" > /dev/null
            id=$(npx wrangler kv namespace list | node scripts/kv-id.mjs "$title")
          fi
          [ -n "$id" ] || { echo "::error::Non riesco a creare la memoria KV"; exit 1; }
          sed -i "s/INSERISCI_ID_KV/$id/" wrangler.toml
      - name: Pubblica
        run: npx wrangler deploy
      - name: Segreti del Worker
        run: |
          node -e 'const o={ANTHROPIC_API_KEY:process.env.ANTHROPIC_API_KEY,APP_SECRET:process.env.APP_SECRET};if(process.env.AZURE_SPEECH_KEY)o.AZURE_SPEECH_KEY=process.env.AZURE_SPEECH_KEY;require("fs").writeFileSync("/tmp/s.json",JSON.stringify(o))'
          npx wrangler secret bulk /tmp/s.json
          rm -f /tmp/s.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
